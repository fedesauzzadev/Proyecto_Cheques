name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Coelsa.sln

      - name: Build
        run: dotnet build Coelsa.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Coelsa.sln --no-build --configuration Release --logger "console;verbosity=normal"

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build de la imagen
        run: docker build -t coelsa-api:ci .
