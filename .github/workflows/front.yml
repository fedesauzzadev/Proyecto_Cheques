name: Front CI

# CI propio del front (RNF-F08): solo corre cuando cambia Front_Coelsa/**.
on:
  push:
    branches: [main, develop]
    paths:
      - 'Front_Coelsa/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Front_Coelsa/**'

jobs:
  lint-test-build:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front_Coelsa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Front_Coelsa/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
