# Blueprint de Render: https://render.com/docs/blueprint-spec
# Monorepo: el backend vive en Coelsa/ (rootDir), el front en Front_Coelsa/.
# Produccion sigue la rama main, desarrollo sigue la rama develop.
# Los secretos (sync: false) se completan en el dashboard al aplicar el blueprint.
services:
  - type: web
    name: coelsa-api-prod
    runtime: docker
    rootDir: Coelsa
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: COELSA__SWAGGER
        value: "true"
      - key: COELSA__SEED
        value: "true"
      - key: ConnectionStrings__Postgres
        sync: false
      - key: ConnectionStrings__Redis
        sync: false

  - type: web
    name: coelsa-api-dev
    runtime: docker
    rootDir: Coelsa
    plan: free
    autoDeploy: true
    branch: develop
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: COELSA__SWAGGER
        value: "true"
      - key: COELSA__SEED
        value: "true"
      - key: ConnectionStrings__Postgres
        sync: false
      - key: ConnectionStrings__Redis
        sync: false

  # ── Banco IrmaRios (RFC-004): solo dev hasta que haya producto mostrable ──

  - type: web
    name: irmarios-identidad-dev
    runtime: docker
    rootDir: IrmaRios/Identidad
    plan: free
    autoDeploy: true
    branch: develop
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: IRMARIOS__SWAGGER
        value: "true"
      - key: ConnectionStrings__Postgres
        sync: false
      - key: OTEL_SERVICE_NAME
        value: irmarios-identidad-dev
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  - type: web
    name: irmarios-cartera-dev
    runtime: docker
    rootDir: IrmaRios/Cartera
    plan: free
    autoDeploy: true
    branch: develop
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: IRMARIOS__SWAGGER
        value: "true"
      - key: ConnectionStrings__Postgres
        sync: false
      - key: ConnectionStrings__Redis
        sync: false
      - key: Integraciones__Coelsa__BaseUrl
        value: https://coelsa-api-dev.onrender.com
      - key: Integraciones__Identidad__BaseUrl
        value: https://irmarios-identidad-dev.onrender.com
      - key: OTEL_SERVICE_NAME
        value: irmarios-cartera-dev
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  # Front web (SPA): rootDir propio, publish relativo a él y rewrite a /index.html
  # para el ruteo del lado del cliente. VITE_API_URL se incrusta en el build.
  - type: web
    name: front-coelsa-prod
    runtime: static
    rootDir: Front_Coelsa
    autoDeploy: true
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - Front_Coelsa/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://coelsa-api-prod.onrender.com

  - type: web
    name: front-coelsa-dev
    runtime: static
    rootDir: Front_Coelsa
    autoDeploy: true
    branch: develop
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - Front_Coelsa/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://coelsa-api-dev.onrender.com
